[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200
  force = true

[[redirects]]
  from = "/api/stt"
  to = "/.netlify/functions/stt"
  status = 200
  force = true

[[redirects]]
  from = "/api/dm"
  to = "/.netlify/functions/dm"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true
